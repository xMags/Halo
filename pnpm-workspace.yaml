packages:
  - apps/*
  - packages/*
# Hoisted layout: the API image starts with `node --import tsx` from the repo
# root (apps/api/Dockerfile), which resolves only because hoisting puts tsx in
# the root node_modules. Under the default isolated layout the container exits
# with ERR_MODULE_NOT_FOUND.
nodeLinker: hoisted
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
