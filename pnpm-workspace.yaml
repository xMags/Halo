packages:
  - apps/*
  - packages/*
# Hoisted layout (Expo's recommended pnpm setup for React Native): the default
# .pnpm virtual store doubles path depth, which overflows Windows' 250-char
# CMake object-path limit when Gradle compiles native modules (screens,
# worklets); ninja then loops with "manifest still dirty".
nodeLinker: hoisted
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
# The only patch is for the Expo app, so patches live beside it; patchesDir
# keeps `pnpm patch-commit` writing new ones there too.
patchesDir: apps/mobile/patches
patchedDependencies:
  expo-libvlc-player@7.1.2: apps/mobile/patches/expo-libvlc-player@7.1.2.patch
