[package]
name = "halo-desktop"
version = "0.1.0"
description = "Halo desktop client"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
sha2 = "0.10"
futures-util = "0.3"
# Pipes, IO and Security: the Discord Rich Presence named-pipe client
# (discord.rs) and its tests' fake Discord server.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }
# Discord artwork URL checks; already in the build through Tauri.
url = "2"
tauri-plugin-dialog = "2"
# COM access to this process's Windows audio session (audio_session.rs) and the
# window's icons (window_icon.rs); the version Tauri already depends on, so it
# adds no new crate to the build.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
opt-level = 1
